{# Downloads notification panel — giữ nguyên Volt button style #}
{% load i18n %}

<div class="theme-settings card bg-gray-800 pt-2 collapse" id="theme-settings" style="width:320px;">
    <div class="card-body bg-gray-800 text-white pt-4 pb-3">
        <button type="button" class="btn-close btn-close-white position-absolute top-0 end-0 m-2"
            data-bs-toggle="collapse" href="#theme-settings" role="button"></button>

        <p class="text-white fw-semibold mb-2 small d-flex align-items-center gap-2">
            <svg class="icon icon-xs text-warning" fill="currentColor" viewBox="0 0 20 20">
                <path fill-rule="evenodd" d="M3 17a1 1 0 011-1h12a1 1 0 110 2H4a1 1 0 01-1-1zm3.293-7.707a1 1 0 011.414 0L9 10.586V3a1 1 0 112 0v7.586l1.293-1.293a1 1 0 111.414 1.414l-3 3a1 1 0 01-1.414 0l-3-3a1 1 0 010-1.414z" clip-rule="evenodd"/>
            </svg>
            Thông báo tải xuống
        </p>

        <div id="dlNotifList" style="max-height:320px;overflow-y:auto;">
            <div class="text-center py-3">
                <span class="spinner-border spinner-border-sm text-secondary"></span>
            </div>
        </div>

        <div class="d-flex gap-2 mt-3 pt-2 border-top border-secondary">
            <a href="{% url 'render_list' %}" class="btn btn-sm btn-secondary flex-fill text-center" style="font-size:.72rem;">
                <svg class="icon icon-xs me-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 4v16M17 4v16M3 8h4m10 0h4M3 12h18"/></svg>
                Xem renders
            </a>
            <button class="btn btn-sm btn-secondary flex-fill" onclick="loadDlNotif(true)" style="font-size:.72rem;">
                <svg class="icon icon-xs me-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/></svg>
                Làm mới
            </button>
        </div>
    </div>
</div>

<div class="card theme-settings bg-gray-800 theme-settings-expand" id="theme-settings-expand">
    <div class="card-body bg-gray-800 text-white rounded-top p-3 py-2">
        <span class="fw-bold d-inline-flex align-items-center h6 position-relative">
            <svg class="icon icon-xs me-2" fill="currentColor" viewBox="0 0 20 20">
                <path fill-rule="evenodd" d="M11.49 3.17c-.38-1.56-2.6-1.56-2.98 0a1.532 1.532 0 01-2.286.948c-1.372-.836-2.942.734-2.106 2.106.54.886.061 2.042-.947 2.287-1.561.379-1.561 2.6 0 2.978a1.532 1.532 0 01.947 2.287c-.836 1.372.734 2.942 2.106 2.106a1.532 1.532 0 012.287.947c.379 1.561 2.6 1.561 2.978 0a1.533 1.533 0 012.287-.947c1.372.836 2.942-.734 2.106-2.106a1.533 1.533 0 01.947-2.287c1.561-.379 1.561-2.6 0-2.978a1.532 1.532 0 01-.947-2.287c.836-1.372-.734-2.942-2.106-2.106a1.532 1.532 0 01-2.287-.947zM10 13a3 3 0 100-6 3 3 0 000 6z" clip-rule="evenodd"></path>
            </svg>
            Thông báo
            {# Badge đỏ nếu có item ready #}
            <span id="dlReadyBadge" class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger d-none" style="font-size:.55rem;min-width:.9rem;padding:.2rem .3rem;">●</span>
        </span>
    </div>
</div>

<script>
var _dlLoaded = false, _dlPoll = null;

// Load khi mở panel
document.getElementById('theme-settings')?.addEventListener('show.bs.collapse', function() {
    loadDlNotif(false);
});

// Kiểm tra badge khi tải trang (không flicker vì chỉ cập nhật badge)
(async function checkReadyBadge() {
    try {
        var r = await fetch('/media/downloads/', {headers:{'X-Requested-With':'XMLHttpRequest'}});
        var d = await r.json();
        var hasReady   = [...d.archives, ...d.renders].some(x => x.status === 'ready');
        var hasPending = [...d.archives, ...d.renders].some(x => x.status === 'pending' || x.status === 'processing');
        document.getElementById('dlReadyBadge')?.classList.toggle('d-none', !hasReady);
        if (hasPending) setTimeout(checkReadyBadge, 10000);
    } catch(e) {}
})();

function _itemActionHtml(item) {
    if (item.status === 'ready') {
        var dlUrl = item.type === 'render' ? '/renders/' + item.id + '/download/' : (item.download_url || '#');
        return '<a href="' + dlUrl + '" class="btn btn-success btn-sm px-2 py-1 d-inline-flex align-items-center gap-1" style="font-size:.7rem;white-space:nowrap;">'
            + '<svg class="icon icon-xs" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"/></svg>'
            + (item.type === 'render' ? 'MP4' : 'ZIP') + '</a>';
    } else if (item.status === 'processing') {
        return '<div class="text-center"><div class="spinner-border spinner-border-sm text-warning" style="width:.8rem;height:.8rem;"></div>'
            + (item.progress ? '<div style="font-size:.6rem;color:#aaa;">' + item.progress + '%</div>' : '') + '</div>';
    } else if (item.status === 'pending') {
        return '<div class="spinner-border spinner-border-sm text-secondary" style="width:.8rem;height:.8rem;"></div>';
    } else if (item.status === 'failed') {
        return '<span class="badge bg-danger" style="font-size:.6rem;">Lỗi</span>';
    } else if (item.status === 'expired') {
        return '<span class="badge bg-secondary" style="font-size:.6rem;">Hết hạn</span>';
    }
    return '';
}

function _itemIcon(type) {
    return type === 'render'
        ? '<svg class="icon icon-xs text-info flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 4v16M17 4v16M3 8h4m10 0h4M3 12h18"/></svg>'
        : '<svg class="icon icon-xs text-warning flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 8h14M5 8a2 2 0 110-4h14a2 2 0 110 4M5 8v10a2 2 0 002 2h10a2 2 0 002-2V8m-9 4h4"/></svg>';
}

async function loadDlNotif(force) {
    if (_dlLoaded && !force) return;
    _dlLoaded = true;
    if (_dlPoll) { clearInterval(_dlPoll); _dlPoll = null; }

    var el = document.getElementById('dlNotifList');
    try {
        var r    = await fetch('/media/downloads/', {headers:{'X-Requested-With':'XMLHttpRequest'}});
        var data = await r.json();
        var all  = [...data.archives.map(x=>({...x,type:'zip'})),
                    ...data.renders.map(x=>({...x,type:'render'}))];

        all.sort(function(a,b) {
            var order = {ready:0, processing:1, pending:2, failed:3, expired:4};
            return (order[a.status]||5) - (order[b.status]||5);
        });

        if (!all.length) {
            // Chỉ set innerHTML nếu nội dung thực sự khác (tránh flicker)
            var empty = '<div class="text-gray-400 text-center py-3 small" data-dl-empty>Chưa có gói tải nào.</div>';
            if (!el.querySelector('[data-dl-empty]')) el.innerHTML = empty;
            return;
        }

        // ── Diff: chỉ thêm/cập nhật/xoá node cần thiết ──────────────────
        var existingIds = new Set();
        el.querySelectorAll('[data-dl-id]').forEach(function(n) { existingIds.add(n.dataset.dlId); });

        var newIds = new Set(all.map(x => x.id));

        // Xoá node không còn trong data
        el.querySelectorAll('[data-dl-id]').forEach(function(n) {
            if (!newIds.has(n.dataset.dlId)) n.remove();
        });

        // Xoá placeholder nếu có
        el.querySelector('[data-dl-empty]')?.remove();

        all.forEach(function(item) {
            var camName = item.camera_name || item.camera_code || '';
            var label   = item.type === 'render'
                ? (item.date_from + ' → ' + item.date_to + ' · ' + item.fps + 'fps')
                : ((item.item_count||0) + ' ảnh');
            var actionHtml = _itemActionHtml(item);

            var existing = el.querySelector('[data-dl-id="' + item.id + '"]');
            if (existing) {
                // Chỉ cập nhật phần action (spinner/button) để tránh flicker toàn row
                var actionEl = existing.querySelector('[data-dl-action]');
                if (actionEl) actionEl.innerHTML = actionHtml;
                // Cập nhật label nếu đổi (vd. item_count)
                var labelEl = existing.querySelector('[data-dl-label]');
                if (labelEl && labelEl.textContent !== label) labelEl.textContent = label;
            } else {
                // Thêm node mới
                var div = document.createElement('div');
                div.className = 'd-flex align-items-center gap-2 py-2 border-bottom border-secondary';
                div.dataset.dlId = item.id;
                div.innerHTML = _itemIcon(item.type)
                    + '<div class="flex-grow-1 min-w-0">'
                    + '<div class="text-white fw-semibold text-truncate" style="font-size:.75rem;">' + camName + '</div>'
                    + '<div class="text-gray-400 text-truncate" style="font-size:.68rem;" data-dl-label>' + label + '</div>'
                    + '</div>'
                    + '<div class="flex-shrink-0 ms-1" data-dl-action>' + actionHtml + '</div>';
                el.appendChild(div);
            }
        });

        // Poll nếu còn item đang xử lý
        var hasPending = all.some(x => x.status === 'pending' || x.status === 'processing');
        if (hasPending) {
            _dlPoll = setInterval(function() { loadDlNotif(true); }, 6000);
        }

        // Cập nhật badge
        var hasReady = all.some(x => x.status === 'ready');
        document.getElementById('dlReadyBadge')?.classList.toggle('d-none', !hasReady);
    } catch(e) {}
}
</script>
